<!doctype html>
<html lang="en-IN">
  <head>
    <meta charset="UTF-8" />
    <!-- Google tag (gtag.js) – Google Analytics 4. Only loads on the live domain, so local
         development and automated tests don't count as visitors. -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      if (/(^|\.)trackmyship\.co$/.test(location.hostname)) {
        // The tag (~170 KB) is downloaded after the page has loaded so it doesn't slow the first
        // view; the page view below is queued now and sent as soon as it arrives.
        var loadGa = function () {
          var ga = document.createElement('script');
          ga.async = true;
          ga.src = 'https://www.googletagmanager.com/gtag/js?id=G-9SSY3WPVGQ';
          document.head.appendChild(ga);
        };
        if (document.readyState === 'complete') loadGa(); else window.addEventListener('load', loadGa);
        gtag('js', new Date());
        // Tracking links (/?q=AWB) are reported without the tracking number, so customers'
        // parcel numbers never reach Google Analytics.
        gtag('config', 'G-9SSY3WPVGQ', { page_location: location.origin + location.pathname });
      }
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta name="referrer" content="strict-origin-when-cross-origin" />
