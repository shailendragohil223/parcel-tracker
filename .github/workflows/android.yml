# Builds the Track My Ship Android app (android/).
#  - Always: a test APK you can install on a phone.
#  - When the signing secrets are set: the signed .aab to upload to Google Play, and a signed APK.
# Download the files from the run page > Artifacts. Run manually from the Actions tab
# ("Build Android app" > Run workflow), or automatically when android/ changes.
#
# Repository secrets (Settings > Secrets and variables > Actions):
#   ANDROID_KEYSTORE_BASE64    the upload keystore (.jks), base64-encoded
#   ANDROID_KEYSTORE_PASSWORD  its password (also used as the key password)
#   ANDROID_KEY_ALIAS          optional, defaults to "upload"
name: Build Android app

on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version name shown on Google Play (e.g. 1.0.1)'
        type: string
        default: '1.0.0'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Each Play upload needs a higher version code; the run number always increases.
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: ${{ inputs.version_name || '1.0.0' }}
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Build test APK (debug)
        working-directory: android
        run: gradle --no-daemon assembleDebug

      - name: Build signed release (.aab for Play + .apk)
        if: env.HAS_KEYSTORE == 'true'
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          export ANDROID_KEYSTORE_FILE="$RUNNER_TEMP/upload.jks"
          gradle --no-daemon bundleRelease assembleRelease
          rm -f "$RUNNER_TEMP/upload.jks"
          # Show the certificate the release was signed with (must match assetlinks.json)
          "$ANDROID_HOME"/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner verify --print-certs app/build/outputs/apk/release/app-release.apk | grep -i sha-256

      - name: Collect files
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk "out/trackmyship-${VERSION_NAME}-${VERSION_CODE}-test.apk"
          if [ "$HAS_KEYSTORE" = true ]; then
            cp android/app/build/outputs/bundle/release/app-release.aab "out/trackmyship-${VERSION_NAME}-${VERSION_CODE}-playstore.aab"
            cp android/app/build/outputs/apk/release/app-release.apk "out/trackmyship-${VERSION_NAME}-${VERSION_CODE}-release.apk"
          else
            echo "::warning::Signing secrets are not set, so only the test APK was built. See android/README.md."
          fi
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: trackmyship-android-${{ env.VERSION_NAME }}-${{ env.VERSION_CODE }}
          path: out/
          retention-days: 30
