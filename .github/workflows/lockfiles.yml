# Keeps package-lock.json files in sync with package.json (root, server/, client/).
# Runs when a package.json changes, or manually from the Actions tab.
name: Update lock files

on:
  push:
    branches: [main]
    paths:
      - 'package.json'
      - 'server/package.json'
      - 'client/package.json'
      - '.github/workflows/lockfiles.yml'
      - 'client/**'
      - 'server/**'
  workflow_dispatch:
    inputs:
      screenshots_branch:
        description: 'Also save screenshots to the ci-screenshots branch'
        type: boolean
        default: false
      upgrade_packages:
        description: 'Space-separated packages to upgrade in client/ (e.g. "vite@latest @vitejs/plugin-react@latest"); committed only if all checks pass'
        type: string
        default: ''

permissions:
  contents: write

jobs:
  lockfiles:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Upgrade packages (manual runs only)
        if: github.event_name == 'workflow_dispatch' && inputs.upgrade_packages != ''
        run: |
          cd client && npm install --save --no-audit --no-fund ${{ inputs.upgrade_packages }}
          node -e 'const p=require("./package.json");console.log("::notice::upgraded:",JSON.stringify(p.dependencies))'
      - name: Generate lock files
        run: |
          npm install --package-lock-only --no-audit --no-fund
          (cd server && npm install --package-lock-only --no-audit --no-fund)
          (cd client && npm install --package-lock-only --no-audit --no-fund)
      - name: Check they install cleanly and the client builds
        run: |
          (cd server && npm ci --omit=dev --no-audit --no-fund)
          (cd client && npm ci --no-audit --no-fund && npm run build)
      - name: Security audit of production dependencies (fails on high/critical)
        run: |
          report() { npm audit --omit=dev --json | node -e 'let j="";process.stdin.on("data",d=>j+=d).on("end",()=>{const v=JSON.parse(j).vulnerabilities||{};for(const [n,x] of Object.entries(v)){const via=x.via.map(a=>typeof a==="string"?a:a.title+" "+(a.range||"")).join("; ");console.log(`::error::${process.argv[1]}: ${n} ${x.range} [${x.severity}] fix=${JSON.stringify(x.fixAvailable)} :: ${via}`)}})' "$1"; }
          (cd server && (npm audit --omit=dev --audit-level=high || { report server; false; }))
          (cd client && (npm audit --omit=dev --audit-level=high || { report client; false; }))
      - name: Simulate the host (root install + build, like GoDaddy)
        run: |
          # Report the failing command and server log as annotations (readable via the API)
          trap 'test -f check.log && echo "::error::$(grep "^FAIL" check.log | tr "\n" "|")"; echo "::error::Failed: $BASH_COMMAND"; test -f start.log && tail -5 start.log | sed "s/^/::error::server: /"' ERR
          rm -rf server/node_modules client/node_modules client/dist client/dist-ssr
          NODE_ENV=production npm ci --no-audit --no-fund
          NODE_ENV=production npm run build
          test -f client/dist/index.html
          test -f client/dist-ssr/entry-server.js
          test -d server/node_modules/express
          (PORT=5099 DEMO_SHIPMENTS=true timeout 240 npm start > start.log 2>&1 &) ; sleep 8
          (PORT=5098 timeout 240 npm start > start-live.log 2>&1 &) ; sleep 4
          curl -fsS http://localhost:5099/api/health
          grep -q 'Site build is up to date' start.log
          curl -fsS "http://localhost:5099/api/track?q=TMS100245781" | head -c 200
          curl -fsS http://localhost:5099/ | grep -q '<div id="root" data-ssr="1">'
          curl -fsSI http://localhost:5099/ | grep -i 'referrer-policy: strict-origin-when-cross-origin'
          # Android app link verification file
          curl -fsS http://localhost:5099/.well-known/assetlinks.json | grep -q '"package_name":"co.trackmyship.app"'
          # Crawler / SEO / browser checks (see scripts/check_site.py)
          pip install --quiet playwright==1.47.0
          python3 scripts/check_site.py http://localhost:5099 --browser --demo > check.log 2>&1 || { cat check.log; false; }
          cat check.log
          # Live-site defaults: demo shipments must not be searchable
          test "$(curl -s -o /dev/null -w '%{http_code}' 'http://localhost:5098/api/track?q=TMS100245781')" != 200
          curl -s 'http://localhost:5098/api/track?q=9876543210' | grep -q 'mobile number isn'
          # Crawler visits are logged and fake ones (from localhost) are not verified
          grep -q '\[crawler\] {"bot":"OAI-SearchBot","verified":false' start.log
          mkdir -p shots && cp check.log shots/check.log
          # Screenshots (downloadable from the run's Artifacts)
          mkdir -p shots
          for u in "home|/" "dtdc|/dtdc-tracking" "result|/?q=TMS100245781" "privacy|/privacy-policy" "guide|/parcel-tracking-guide" "courier|/delhivery-tracking" "blog|/blog" "post|/blog/out-for-delivery-not-delivered"; do
            google-chrome --headless=new --no-sandbox --hide-scrollbars --window-size=1280,1600 \
              --virtual-time-budget=8000 --screenshot="shots/${u%%|*}.png" "http://localhost:5099${u#*|}" 2>/dev/null
          done
          google-chrome --headless=new --no-sandbox --hide-scrollbars --window-size=390,1500 \
            --virtual-time-budget=8000 --screenshot=shots/mobile.png http://localhost:5099/ 2>/dev/null
          google-chrome --headless=new --no-sandbox --hide-scrollbars --window-size=390,2400 \
            --virtual-time-budget=8000 --screenshot=shots/mobile-post.png http://localhost:5099/blog/how-to-write-delivery-address-india 2>/dev/null
          ls -la shots
          rm -f start.log
      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: shots/
          retention-days: 3
      - name: Commit lock files
        run: |
          node scripts/generate-crawler-files.mjs
          git add client/package.json package-lock.json server/package-lock.json client/package-lock.json client/public/sitemap.xml client/public/robots.txt client/public/llms.txt
          if git diff --cached --quiet; then echo "Lock files already up to date"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update packages, lock files and crawler files (sitemap.xml, robots.txt, llms.txt)"
          git push
      - name: Save screenshots to ci-screenshots branch
        if: github.event_name == 'workflow_dispatch' && inputs.screenshots_branch
        run: |
          cp -r shots /tmp/shots
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan ci-screenshots
          git rm -rq --cached . && git clean -fdq -e shots
          cp /tmp/shots/* . && git add *.png check.log
          git commit -qm "Screenshots of ${GITHUB_SHA::7}"
          git push -f origin ci-screenshots
          git checkout -f main
