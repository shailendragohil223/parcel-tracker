plugins {
    id 'com.android.application'
}

// Release signing comes from environment variables (set by the GitHub Actions workflow from
// repository secrets). The keystore itself is never committed.
def keystoreFile = System.getenv('ANDROID_KEYSTORE_FILE')

android {
    namespace 'co.trackmyship.app'
    compileSdk 36

    defaultConfig {
        applicationId 'co.trackmyship.app'
        minSdk 23
        targetSdk 36   // Google Play requires API 36 for new apps/updates from 31 Aug 2026
        // Each Play upload needs a higher versionCode: CI passes the run number.
        versionCode((System.getenv('VERSION_CODE') ?: '1').toInteger())
        versionName System.getenv('VERSION_NAME') ?: '1.0.0'
    }

    signingConfigs {
        release {
            if (keystoreFile) {
                storeFile file(keystoreFile)
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                keyAlias System.getenv('ANDROID_KEY_ALIAS') ?: 'upload'
                keyPassword System.getenv('ANDROID_KEY_PASSWORD') ?: System.getenv('ANDROID_KEYSTORE_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (keystoreFile) signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.6.2'
}
